name: Update star history
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
  push:
    paths:
      - scripts/update_star_history.py
      - .github/workflows/star-history.yml
permissions:
  contents: write
concurrency:
  group: star-history
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'Axion1-0/axion1-0.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate chart from GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_star_history.py
      - name: Save updated chart
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/star-history.svg assets/star-history.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update star history [skip ci]'
          git pull --rebase origin main
          git push
